<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قارئ أوراق iCOOL</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* VOICE: a quiet machine-room console — one job, done well
   IDEA: the reader as a scanner tray: the sheet in, the lines out
   PICTURE: the sheet now being read, large, with a scan line passing over it
   COLOUR and TYPE: iCOOL blue #0066A7 dominant, orange #F1471E accent; Readex Pro titles, IBM Plex Sans Arabic text
   LAYOUT: status + switch on top, tray (current sheet) below, queue list last */
:root{color-scheme:light dark;--bg:light-dark(#f4f7fa,#0c1520);--card:light-dark(#fff,#132232);--ink:light-dark(#10202e,#e7eef5);--mut:light-dark(#5b6b7a,#93a5b6);--line:light-dark(#dbe3ea,#22364a);--blue:#0066A7;--or:#F1471E;--ok:#138a4f;--bad:#c0392b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
header{background:var(--blue);color:#fff;padding:16px max(5vw,16px) 22px}
.top{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;max-width:900px;margin:0 auto}
.top img{height:38px;background:#fff;border-radius:10px;padding:4px 8px}
h1{font:700 clamp(24px,5vw,34px)/1.1 "Readex Pro",sans-serif;margin:0}
.sub{opacity:.85;font-size:14px}
main{max-width:900px;margin:-14px auto 0;padding:0 max(4vw,14px) 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.state{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 22%,transparent);animation:pulse 1.6s infinite}
.dot.busy{background:var(--or)}
@keyframes pulse{50%{box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 22%,transparent)}}
.big{font:700 22px "Readex Pro",sans-serif}
.grow{flex:1}
button{font:inherit;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 18px;cursor:pointer}
button.pri{background:var(--or);border-color:var(--or);color:#fff;font-weight:700}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--bg);border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font:700 26px "Readex Pro",sans-serif;color:var(--blue)}.kpi span{font-size:13px;color:var(--mut)}
.tray{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.sheetimg{position:relative;border-radius:12px;overflow:hidden;background:var(--bg);min-height:220px;display:grid;place-items:center;color:var(--mut)}
.sheetimg img{width:100%;display:block}
.scan{position:absolute;inset-inline:0;height:3px;background:var(--or);box-shadow:0 0 18px var(--or);top:0;animation:scan 2.4s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 3px)}}
.lines{font-size:14px}.lines div{padding:4px 0;border-bottom:1px dashed var(--line)}
.mut{color:var(--mut);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}th{font-size:13px;color:var(--mut);font-weight:500}
.chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:13px;background:var(--bg);white-space:nowrap}
.chip.done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.chip.error{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}.chip.pending,.chip.working{background:color-mix(in srgb,var(--or) 18%,transparent);color:var(--or)}
.err{color:var(--bad);font-size:14px;margin-top:8px}
@media(max-width:600px){.tray{grid-template-columns:minmax(0,1fr)}.kpis b{font-size:22px}}
@media(prefers-reduced-motion:reduce){.scan,.dot.on{animation:none}}
</style>
</head>
<body>
<header><div class="top"><div><h1>قارئ أوراق iCOOL</h1><div class="sub">يقرأ الأوراق المصوّرة من iCOOL Daily Report بنفس قواعد منصة اليوميات</div></div><img src="__LOGO__" alt="iCOOL"></div></header>
<main>
  <section class="card">
    <div class="state"><span class="dot" id="dot"></span><div class="grow"><div class="big" id="stTitle">القارئ موقّف</div><div class="mut" id="stSub">شغّله وخلّي الصفحة مفتوحة: كل ورقة بيبعتها العمال أو ماهر بتنقرا وبترجع للتطبيق لحالها.</div></div><button class="pri" id="toggle">▶︎ شغّل القارئ</button></div>
    <div class="kpis"><div class="kpi"><b id="kPend">—</b><span>بالدور</span></div><div class="kpi"><b id="kDone">0</b><span>انقرت هالجلسة</span></div><div class="kpi"><b id="kErr">0</b><span>ما زبطت</span></div></div>
    <div class="err" id="err" hidden></div>
  </section>
  <section class="card" id="trayCard" hidden>
    <div class="tray"><div class="sheetimg" id="img"></div><div><div class="big" id="curTitle"></div><div class="mut" id="curSub"></div><div class="lines" id="curLines" style="margin-top:8px"></div></div></div>
  </section>
  <section class="card">
    <div class="big" style="font-size:18px">آخر الأوراق</div>
    <table><thead><tr><th>الورقة</th><th>مين بعتها</th><th>الحالة</th></tr></thead><tbody id="recent"><tr><td colspan="3" class="mut">عم حمّل…</td></tr></tbody></table>
  </section>
</main>
<script>
{
const P = "yjsaudrftboqnoqgfkfh";
const PROMPTS = __PROMPTS__;
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ST = { done: "انقرت", error: "ما زبطت", pending: "بالدور", working: "عم تنقرا" };
let mcp = null, sample = null, on = false, busy = false, timer = null, nDone = 0, nErr = 0;

function parse(res) {
  const p = res && res.payload !== undefined ? res.payload : res;
  let txt = typeof p === "string" ? p : (p && typeof p.result === "string") ? p.result : (p && p.content && p.content[0] && p.content[0].text) ? p.content[0].text : JSON.stringify(p);
  try { const j = JSON.parse(txt); if (j && typeof j.result === "string") txt = j.result; else if (Array.isArray(j)) return j; } catch (e) { }
  const a = txt.indexOf("["), b = txt.lastIndexOf("]");
  if (a < 0 || b < a) throw new Error("رد غير مفهوم من Supabase");
  return JSON.parse(txt.slice(a, b + 1));
}
async function sql(q) { return parse(await mcp.callTool("Supabase", "execute_sql", { project_id: P, query: q })); }
function one(rows) { let r = rows && rows[0] ? rows[0].r : null; if (typeof r === "string") r = JSON.parse(r); return r; }
function dq(s) { return "$rj$" + String(s).replace(/\$rj\$/g, "") + "$rj$"; }
function b64Blob(b) { const bin = atob(b); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: "image/jpeg" }); }
function showErr(m) { const e = $("#err"); e.hidden = !m; e.textContent = m || ""; }
function setState(kind, title, sub) {
  $("#dot").className = "dot" + (kind ? " " + kind : ""); $("#stTitle").textContent = title; if (sub != null) $("#stSub").textContent = sub;
  $("#toggle").textContent = on ? "⏸ وقّف" : "▶︎ شغّل القارئ"; $("#toggle").className = on ? "" : "pri";
}

async function refresh() {
  try {
    const s = one(await sql("select dr.reader_status() as r")) || {};
    $("#kPend").textContent = s.pending ?? "0";
    const rows = s.recent || [];
    $("#recent").innerHTML = rows.length ? rows.map((r) => "<tr><td>" + esc(r.kind === "daylog" ? "ورقة يومية (ماهر)" : (r.site || "ورقة موقع")) + '<div class="mut">' + esc(r.date) + (r.error ? " · " + esc(r.error) : "") + "</div></td><td>" + esc(r.by || "") + '</td><td><span class="chip ' + esc(r.status) + '">' + esc(ST[r.status] || r.status) + "</span></td></tr>").join("") : '<tr><td colspan="3" class="mut">لسا ما في أوراق.</td></tr>';
    showErr("");
  } catch (e) { showErr("Supabase: " + (e.message || e.code || e)); }
}

async function readOne() {
  const job = one(await sql("select dr.reader_next() as r"));
  if (!job) return false;
  $("#trayCard").hidden = false;
  $("#curTitle").textContent = job.kind === "daylog" ? "ورقة ماهر اليومية" : (job.site || "ورقة موقع");
  $("#curSub").textContent = (job.date || "") + " · بعتها " + (job.by || "") + " · " + (job.images || []).length + " صورة";
  $("#curLines").innerHTML = '<div class="mut">Claude عم يقرا الخط… (دقيقة تقريباً)</div>';
  const blobs = (job.images || []).map(b64Blob);
  const img = $("#img"); img.innerHTML = "";
  if (blobs[0]) { const im = new Image(); im.alt = "الورقة"; im.src = URL.createObjectURL(blobs[0]); img.appendChild(im); const sc = document.createElement("div"); sc.className = "scan"; img.appendChild(sc); }
  setState("busy", "عم إقرا ورقة", null);
  try {
    if (!blobs.length) throw { code: "no_images", message: "ما في صور محفوظة لهالورقة" };
    const prompt = (job.kind === "daylog" ? PROMPTS.DAYLOG : PROMPTS.SITE).replace("{{HINT}}", JSON.stringify(job.hint || {}));
    let out;
    try { out = await sample.json(prompt, { images: blobs, modelTier: "complex" }); }
    catch (e) {
      if (e && e.code === "invalid_json" && e.text) { const a = e.text.indexOf("{"), b = e.text.lastIndexOf("}"); out = JSON.parse(e.text.slice(a, b + 1)); }
      else throw e;
    }
    out._read_by = "قارئ iCOOL (claude.ai)"; out._at = new Date().toISOString();
    await sql("select dr.reader_done(" + dq(job.id) + "::uuid, " + dq(JSON.stringify(out)) + "::jsonb) as r");
    nDone++; $("#kDone").textContent = nDone;
    img.querySelector(".scan")?.remove();
    const m = (out.materials || []).length, w = (out.workers || out.crew || []).length, pay = (out.payments || []).length + (out.expenses || []).length;
    $("#curLines").innerHTML = "<div>✓ انقرت: " + w + " عامل · " + m + " بضاعة · " + pay + " مصاريف/دفعات</div>" + (out.doubts || []).map((d) => '<div class="mut">⚠️ ' + esc(d) + "</div>").join("");
  } catch (e) {
    const code = e && e.code;
    img.querySelector(".scan")?.remove();
    nErr++; $("#kErr").textContent = nErr;
    await sql("select dr.reader_fail(" + dq(job.id) + "::uuid, " + dq((code ? code + ": " : "") + (e.message || "")) + ") as r").catch(() => { });
    $("#curLines").innerHTML = '<div class="err">' + esc(e.message || code || "خطأ") + "</div>";
    if (code === "not_granted" || code === "sampling_disabled" || code === "images_unavailable") { on = false; showErr("Claude مش مسموح لهالصفحة (" + code + ")"); }
    if (code === "rate_limited") throw e;
  }
  return true;
}

async function loop() {
  if (!on || busy) return;
  busy = true; clearTimeout(timer);
  let wait = 20000;
  try {
    while (on && await readOne()) { await refresh(); }
    if (on) setState("on", "القارئ شغّال", "عم يستنّى أوراق جديدة — خلّي الصفحة مفتوحة.");
  } catch (e) {
    if (e && e.code === "rate_limited") { wait = 120000; setState("busy", "طلبات كتيرة — بيرجع بعد دقيقتين", null); }
    else showErr(e.message || String(e));
  }
  await refresh();
  busy = false;
  if (on) timer = setTimeout(loop, wait);
}

$("#toggle").addEventListener("click", () => {
  if (!mcp || !sample) return showErr(!mcp ? "رابط Supabase مش متاح بهالعرض" : "Claude مش متاح بهالعرض");
  on = !on;
  try { localStorage.setItem("icool_reader_on", on ? "1" : "0"); } catch (e) { }
  if (on) { setState("on", "القارئ شغّال", "عم يدوّر عأوراق…"); loop(); } else { clearTimeout(timer); setState("", "القارئ موقّف", "شغّله وخلّي الصفحة مفتوحة."); }
});

(async () => {
  [mcp, sample] = await Promise.all([claude.use("mcp"), claude.use("sample")]);
  if (!mcp) { showErr("رابط Supabase مش متاح بهالعرض — افتح الصفحة من claude.ai"); return; }
  await refresh();
  if (!sample) { showErr("Claude مش متاح بهالعرض"); return; }
  let auto = false; try { auto = localStorage.getItem("icool_reader_on") === "1"; } catch (e) { }
  if (auto) { on = true; setState("on", "القارئ شغّال", "عم يدوّر عأوراق…"); loop(); }
  setInterval(() => { if (!busy) refresh(); }, 60000);
})();
}
</script>
</body>
</html>
